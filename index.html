<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鉄拳8 戦績カウンター</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { background: #1e1e24; color: #f5f5f7; font-family: "Segoe UI", Meiryo, sans-serif; padding: 16px; }
    main { width: 100%; max-width: 580px; margin: 0 auto; }
    h1 { margin: 0 0 14px; color: #ff4757; font-size: 1.2rem; text-align: center; letter-spacing: .08em; }
    .panel { background: #2a2a35; border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,.3); }
    .auto-panel { background: #1e1e24; border: 1px solid #3e3e50; border-radius: 8px; margin-bottom: 13px; padding: 11px; }
    .settings-panel { margin-top: 13px; }
    .settings-toggle { align-items: center; cursor: pointer; display: flex; font-size: .8rem; gap: 9px; line-height: 1.45; }
    .settings-toggle input { accent-color: #3867d6; flex: 0 0 auto; height: 18px; width: 18px; }
    .settings-note { color: #90909f; font-size: .7rem; margin: 6px 0 0 27px; }
    .auto-title, .history-title { color: #eccc68; font-size: .84rem; font-weight: 700; margin-bottom: 7px; }
    .monitor-row { display: grid; grid-template-columns: 1fr auto; gap: 7px; }
    select { min-width: 0; background: #2a2a35; border: 1px solid #555568; border-radius: 6px; color: #fff; padding: 8px; }
    .auto-actions, .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 9px; }
    button { border: 0; border-radius: 7px; color: #fff; cursor: pointer; font-weight: 700; padding: 10px 8px; }
    button:disabled, select:disabled { cursor: not-allowed; opacity: .5; }
    #refresh-monitors { background: #4e4e62; }
    #start-auto-tracker { background: #3867d6; }
    #stop-auto-tracker { background: #8854d0; }
    .auto-state { color: #a8c7fa; font-size: .8rem; margin-top: 9px; }
    .auto-error { color: #ff8d98; font-size: .75rem; margin-top: 5px; overflow-wrap: anywhere; }
    .counter-display { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: #1e1e24; padding: 11px 7px; border-radius: 8px; text-align: center; }
    .counter-box h2 { color: #a0a0b0; font-size: .68rem; margin: 0; }
    .counter-box p { font-size: 1.65rem; font-weight: 700; margin: 5px 0 0; }
    .total-color { color: #70a1ff; } .win-color { color: #2ed573; } .lose-color { color: #ff4757; } .rate-color { color: #eccc68; }
    #add-win { background: #2ed573; } #add-lose { background: #ff4757; }
    #undo { background: #4e4e62; } #clear { background: #732f3a; }
    .status { min-height: 2.5em; margin: 11px 0; padding: 8px; border-radius: 6px; background: #1e1e24; color: #a8c7fa; font-size: .78rem; }
    .status-error { color: #ff8d98; }
    .history-title { border-bottom: 2px solid #3e3e50; padding-bottom: 5px; }
    .history-list { display: flex; flex-direction: column; gap: 5px; height: clamp(120px, 17vh, 145px); margin-top: 8px; overflow-x: hidden; overflow-y: auto; }
    .history-item { align-items: center; background: #1e1e24; border-left: 4px solid #3e3e50; border-radius: 5px; display: flex; justify-content: space-between; padding: 7px 9px; }
    .item-win { border-left-color: #2ed573; } .item-lose { border-left-color: #ff4757; }
    .time-text, .history-empty { color: #90909f; font-size: .74rem; }
    .history-empty { padding: 11px 4px; text-align: center; }
    @media (max-width: 480px) { .counter-display { grid-template-columns: 1fr 1fr; } .monitor-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>TEKKEN 8 MATCH RESULTS</h1>
    <section class="panel">
      <section class="auto-panel" aria-labelledby="auto-title">
        <div id="auto-title" class="auto-title">自動判定</div>
        <div class="monitor-row">
          <select id="monitor-select" aria-label="キャプチャ対象モニター"><option value="">モニター取得中…</option></select>
          <button id="refresh-monitors">一覧を再取得</button>
        </div>
        <div class="auto-actions">
          <button id="start-auto-tracker">自動判定を開始</button>
          <button id="stop-auto-tracker" disabled>自動判定を停止</button>
        </div>
        <div class="auto-state">状態：<strong id="auto-status">停止中</strong></div>
        <div id="auto-error" class="auto-error" role="alert" hidden></div>
      </section>
      <div class="counter-display">
        <div class="counter-box"><h2>総試合数</h2><p id="total-matches" class="total-color">0</p></div>
        <div class="counter-box"><h2>WIN</h2><p id="total-wins" class="win-color">0</p></div>
        <div class="counter-box"><h2>LOSE</h2><p id="total-loses" class="lose-color">0</p></div>
        <div class="counter-box"><h2>勝率</h2><p id="win-rate" class="rate-color">0.0%</p></div>
      </div>
      <div class="actions">
        <button id="add-win">WIN追加</button>
        <button id="add-lose">LOSE追加</button>
        <button id="undo">直前の1件を取り消す</button>
        <button id="clear">全記録を消去する</button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">起動しています…</div>
      <div class="history-title">直近10件の履歴</div>
      <div id="history-list" class="history-list"></div>
      <section class="auto-panel settings-panel" aria-labelledby="settings-title">
        <div id="settings-title" class="auto-title">設定</div>
        <label class="settings-toggle">
          <input id="backup-before-clear" type="checkbox" checked>
          <span>全記録消去時にバックアップCSVを作成する</span>
        </label>
        <p class="settings-note">OFFの場合、消去した記録は元に戻せません。</p>
      </section>
    </section>
  </main>
  <script src="stats_polling.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
