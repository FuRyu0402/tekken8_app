<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鉄拳8 戦績カウンター</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1e1e24;
            font-family: 'Segoe UI', Meiryo, sans-serif;
            color: #f5f5f7;
        }

        body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.1rem;
            margin: 0 0 8px 0;
            color: #ff4757;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #2a2a35;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 自分キャラ選択 */
        .top-row {
            display: flex;
            gap: 10px;
        }

        .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 3px;
            color: #a0a0b0;
        }

        select {
            width: 100%;
            padding: 6px 8px;
            background-color: #1e1e24;
            color: #ffffff;
            border: 2px solid #3e3e50;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        select:focus {
            border-color: #ff4757;
            outline: none;
        }

        /* WIN/LOSE/WIN RATE */
        .counter-display {
            display: flex;
            justify-content: space-around;
            background-color: #1e1e24;
            padding: 10px 8px;
            border-radius: 8px;
            text-align: center;
        }

        .counter-box h2 {
            margin: 0;
            font-size: 0.7rem;
            color: #a0a0b0;
            letter-spacing: 1px;
        }

        .counter-box p {
            margin: 4px 0 0 0;
            font-size: 2rem;
            font-weight: bold;
            line-height: 1;
        }

        .win-color {
            color: #2ed573;
        }

        .lose-color {
            color: #ff4757;
        }

        .rate-color {
            color: #eccc68;
        }

        /* メモ欄 */
        .memo-group {
            display: flex;
            flex-direction: column;
        }

        .memo-label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 3px;
            color: #eccc68;
            font-weight: bold;
        }

        .memo-area {
            width: 100%;
            height: 90px;
            padding: 6px 8px;
            background-color: #1e1e24;
            color: #ffffff;
            border: 2px solid #eccc68;
            border-radius: 6px;
            font-size: 0.8rem;
            resize: none;
            font-family: inherit;
        }

        .memo-area:focus {
            border-color: #f9ca24;
            outline: none;
        }

        /* キャラグリッド */
        .section-title {
            font-size: 0.8rem;
            color: #eccc68;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            background-color: #1e1e24;
            padding: 6px;
            border-radius: 8px;
            border: 2px solid #3e3e50;
        }

        /* スマホは4列 */
        @media (max-width: 480px) {
            .char-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .char-btn {
            background-color: #3e3e50;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            height: 36px;
            font-size: 0.72rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 2px;
            transition: background-color 0.1s, transform 0.05s;
        }

        .char-btn:active {
            transform: scale(0.95);
        }

        .char-btn.selected {
            background-color: #ff4757;
            box-shadow: 0 0 6px rgba(255, 71, 87, 0.5);
        }

        .char-btn.long-name {
            font-size: 0.60rem !important;
            letter-spacing: -0.5px;
        }

        /* 対戦履歴 */
        .history-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-title {
            font-size: 0.8rem;
            border-bottom: 2px solid #3e3e50;
            padding-bottom: 2px;
            color: #ff4757;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-height: 160px;
            overflow-y: auto;
        }

        .history-item {
            background-color: #1e1e24;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #3e3e50;
        }

        .item-win {
            border-left-color: #2ed573;
        }

        .item-lose {
            border-left-color: #ff4757;
        }

        .char-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .time-text {
            font-size: 0.65rem;
            color: #707080;
        }

        /* リセットボタン */
        .clear-btn {
            background-color: #2a2a35;
            color: #606070;
            font-size: 0.7rem;
            padding: 5px;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
            border: 1px dashed #4e4e60;
            transition: color 0.2s, border-color 0.2s;
        }

        .clear-btn:hover {
            color: #ff4757;
            border-color: #ff4757;
        }

        /* モーダル共通 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-box {
            background-color: #2a2a35;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 2px solid #3e3e50;
            width: 80%;
            max-width: 280px;
        }

        .modal-title {
            font-size: 0.95rem;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .modal-btn-group {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #fff;
        }

        .m-win {
            background-color: #2ed573;
        }

        .m-lose {
            background-color: #ff4757;
        }

        .m-confirm {
            background-color: #ff4757;
        }

        .m-cancel {
            background-color: #3e3e50;
            color: #a0a0b0;
            font-size: 0.9rem;
            margin-top: 8px;
            width: 100%;
        }

        .m-cancel-reset {
            background-color: #3e3e50;
            color: #a0a0b0;
        }

        /* キャラモーダル（メモ表示＋記録ボタン） */
        .char-modal-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 4px;
        }

        .char-modal-memo {
            background-color: #1e1e24;
            border: 1px solid #3e3e50;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.78rem;
            color: #c0c0d0;
            text-align: left;
            min-height: 48px;
            max-height: 100px;
            overflow-y: auto;
            margin-bottom: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .char-modal-memo.empty {
            color: #505060;
            font-style: italic;
        }

        .modal-record-title {
            font-size: 0.75rem;
            color: #a0a0b0;
            margin-bottom: 6px;
        }
    </style>
</head>

<body>

    <h1>TEKKEN 8 COUNTER</h1>

    <div class="container">

        <!-- 自分キャラ選択 -->
        <div class="top-row">
            <div class="form-group">
                <label for="my-char-select">使用キャラクター（自分）</label>
                <select id="my-char-select"></select>
            </div>
        </div>

        <!-- WIN/LOSE/WIN RATE -->
        <div class="counter-display">
            <div class="counter-box">
                <h2>WIN</h2>
                <p id="total-wins" class="win-color">0</p>
            </div>
            <div class="counter-box">
                <h2>LOSE</h2>
                <p id="total-loses" class="lose-color">0</p>
            </div>
            <div class="counter-box">
                <h2>WIN RATE</h2>
                <p id="win-rate" class="rate-color">0%</p>
            </div>
        </div>

        <!-- メモ欄 -->
        <div class="memo-group">
            <label id="memo-label" class="memo-label" for="char-memo">対戦相手 [ 未選択 ] の対策メモ</label>
            <textarea id="char-memo" class="memo-area" placeholder="キャラクターを選択するとメモが表示されます..." spellcheck="false"
                autocomplete="off"></textarea>
        </div>

        <!-- キャラグリッド -->
        <div class="section-title">対戦相手を選択</div>
        <div id="char-grid" class="char-grid"></div>

        <!-- 対戦履歴 -->
        <div class="history-section">
            <div class="history-title">直近の対戦履歴</div>
            <div id="history-list" class="history-list"></div>
            <button class="clear-btn" onclick="clearHistory()">データをすべてリセット</button>
        </div>

    </div>

    <!-- キャラ選択モーダル（メモ表示＋WIN/LOSE記録） -->
    <div id="char-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="char-modal-name" class="char-modal-name"></div>
            <div id="char-modal-memo" class="char-modal-memo"></div>
            <div class="modal-record-title">対戦結果を記録</div>
            <div class="modal-btn-group">
                <button class="modal-btn m-win" onclick="submitMatchResult('WIN')">WIN</button>
                <button class="modal-btn m-lose" onclick="submitMatchResult('LOSE')">LOSE</button>
            </div>
            <button class="modal-btn m-cancel" onclick="closeCharModal()">閉じる</button>
        </div>
    </div>

    <!-- リセット確認モーダル -->
    <div id="reset-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">⚠️ データをリセット</div>
            <p style="font-size:0.8rem; color:#a0a0b0; margin: 0 0 12px 0;">すべての戦績を削除します。<br>対策メモと選択状態は維持されます。</p>
            <div class="modal-btn-group">
                <button class="modal-btn m-cancel-reset" onclick="closeResetModal()">キャンセル</button>
                <button class="modal-btn m-confirm" onclick="executeReset()">リセット</button>
            </div>
        </div>
    </div>

    <script>
        const characterList = [
            "アーマーキング", "アズセナ", "飛鳥", "アリサ", "アンナ", "一八", "ヴィクター", "エディ",
            "キング", "クマ", "クラウディオ", "クライヴ", "州光", "ザフィーナ", "ジャック8", "シャオユウ",
            "シャヒーン", "準", "仁", "スティーブ", "デビル仁", "ドラグノフ", "ニーナ", "範馬 勇次郎",
            "パンダ", "平八", "ファラン", "ファーカムラム", "フェン", "ブライアン", "ボブ", "ポール",
            "ミアリズ", "吉光", "ラース", "リディア", "リリ", "リロイ", "リー", "レイヴン", "麗奈",
            "レオ", "ロジャーJr.", "ロウ"
        ];

        let matchHistory = JSON.parse(localStorage.getItem('t8_counter_v4')) || [];
        let characterMemos = JSON.parse(localStorage.getItem('t8_memos_v4')) || {};
        let currentSelectedOpponent = localStorage.getItem('t8_current_opp_v4') || "一八";
        let pendingOpponentCharacter = "";

        // メモエリアのイベントリスナーを1回だけ登録
        document.getElementById('char-memo').addEventListener('input', saveCharacterMemo);

        // 自分キャラのドロップダウン初期化
        function initMyCharacterDropdown() {
            const mySelect = document.getElementById('my-char-select');
            mySelect.innerHTML = '';
            characterList.forEach(char => {
                const opt = document.createElement('option');
                opt.value = char;
                opt.textContent = char;
                mySelect.appendChild(opt);
            });
            mySelect.value = "仁";
        }

        // 対戦相手グリッドの生成
        function initOpponentGrid() {
            const grid = document.getElementById('char-grid');
            grid.innerHTML = '';
            characterList.forEach(char => {
                const btn = document.createElement('button');
                btn.className = 'char-btn';
                if (char.length >= 6) btn.classList.add('long-name');
                btn.id = 'btn-' + char;
                btn.textContent = char;
                btn.onclick = function () { openCharModal(char); };
                grid.appendChild(btn);
            });
            highlightCurrentOpponent();
        }

        // 現在選択中のキャラを強調
        function highlightCurrentOpponent() {
            characterList.forEach(char => {
                const btn = document.getElementById('btn-' + char);
                if (btn) btn.classList.remove('selected');
            });
            const activeBtn = document.getElementById('btn-' + currentSelectedOpponent);
            if (activeBtn) activeBtn.classList.add('selected');
        }

        // キャラボタンを押したらモーダルを開く（メモ表示＋WIN/LOSE選択）
        function openCharModal(char) {
            pendingOpponentCharacter = char;
            document.getElementById('char-modal-name').textContent = char;

            const memo = characterMemos[char] || "";
            const memoEl = document.getElementById('char-modal-memo');
            if (memo) {
                memoEl.textContent = memo;
                memoEl.classList.remove('empty');
            } else {
                memoEl.textContent = "メモはまだありません";
                memoEl.classList.add('empty');
            }

            document.getElementById('char-modal').style.display = 'flex';
        }

        function closeCharModal() {
            document.getElementById('char-modal').style.display = 'none';
        }

        // WIN/LOSE記録
        function submitMatchResult(result) {
            const myChar = document.getElementById('my-char-select').value;
            const oppChar = pendingOpponentCharacter;

            matchHistory.push({
                myChar: myChar,
                oppChar: oppChar,
                result: result,
                timestamp: new Date().getTime()
            });
            localStorage.setItem('t8_counter_v4', JSON.stringify(matchHistory));

            currentSelectedOpponent = oppChar;
            localStorage.setItem('t8_current_opp_v4', currentSelectedOpponent);

            highlightCurrentOpponent();
            loadCharacterMemo();
            updateDisplay();
            closeCharModal();
        }

        function formatTimestamp(ms) {
            if (!ms) return "不明";
            const d = new Date(ms);
            return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }

        function updateDisplay() {
            let wins = 0, loses = 0;
            const listContainer = document.getElementById('history-list');
            listContainer.innerHTML = '';

            const maxDisplay = 10;
            let count = 0;

            for (let i = matchHistory.length - 1; i >= 0; i--) {
                const match = matchHistory[i];
                if (match.result === 'WIN') wins++;
                if (match.result === 'LOSE') loses++;

                if (count < maxDisplay) {
                    const item = document.createElement('div');
                    item.className = 'history-item ' + (match.result === 'WIN' ? 'item-win' : 'item-lose');
                    item.innerHTML =
                        '<div class="char-info">' +
                        '<strong>' + match.oppChar + '</strong>' +
                        '<span class="time-text">(' + formatTimestamp(match.timestamp) + ' / 自分: ' + match.myChar + ')</span>' +
                        '</div>' +
                        '<span><strong>' + match.result + '</strong></span>';
                    listContainer.appendChild(item);
                    count++;
                }
            }

            const total = wins + loses;
            const rate = total > 0 ? Math.round((wins / total) * 100) : 0;

            document.getElementById('total-wins').innerText = wins;
            document.getElementById('total-loses').innerText = loses;
            document.getElementById('win-rate').innerText = rate + '%';
        }

        function loadCharacterMemo() {
            document.getElementById('memo-label').textContent =
                '対戦相手 [ ' + currentSelectedOpponent + ' ] の対策メモ';
            document.getElementById('char-memo').value =
                characterMemos[currentSelectedOpponent] || "";
        }

        function saveCharacterMemo() {
            characterMemos[currentSelectedOpponent] =
                document.getElementById('char-memo').value;
            localStorage.setItem('t8_memos_v4', JSON.stringify(characterMemos));
        }

        function clearHistory() {
            document.getElementById('reset-modal').style.display = 'flex';
        }

        function closeResetModal() {
            document.getElementById('reset-modal').style.display = 'none';
        }

        function executeReset() {
            matchHistory = [];
            localStorage.setItem('t8_counter_v4', JSON.stringify([]));
            updateDisplay();
            highlightCurrentOpponent();
            loadCharacterMemo();
            closeResetModal();
        }

        // 起動時初期化
        initMyCharacterDropdown();
        initOpponentGrid();
        updateDisplay();
        loadCharacterMemo();
    </script>
</body>

</html>
