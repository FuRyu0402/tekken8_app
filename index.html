<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鉄拳8 戦績カウンター</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1e1e24;
            font-family: 'Segoe UI', Meiryo, sans-serif;
            color: #f5f5f7;
            overflow: hidden;
        }

        body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.1rem;
            margin: 0 0 8px 0;
            color: #ff4757;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .container {
            width: 100%;
            max-width: 100%;
            background-color: #2a2a35;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;

            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .top-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 3px;
            color: #a0a0b0;
        }

        select {
            width: 100%;
            padding: 6px 8px;
            background-color: #1e1e24;
            color: #ffffff;
            border: 2px solid #3e3e50;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            box-sizing: border-box;
        }

        select:focus {
            border-color: #ff4757;
            outline: none;
        }

        /* カウンター表示のコンパクト化 */
        .counter-display {
            display: flex;
            justify-content: space-around;
            background-color: #1e1e24;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 8px;
            text-align: center;
            flex-shrink: 0;
        }

        .counter-box h2 {
            margin: 0;
            font-size: 0.7rem;
            color: #a0a0b0;
        }

        .counter-box p {
            margin: 2px 0 0 0;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .win-color {
            color: #2ed573;
        }

        .lose-color {
            color: #ff4757;
        }

        .rate-color {
            color: #eccc68;
        }

        /* メモエリアのコンパクト化 */
        .memo-group {
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .memo-area {
            width: 100%;
            height: 45px;
            padding: 6px 8px;
            background-color: #1e1e24;
            color: #ffffff;
            border: 2px solid #3e3e50;
            border-radius: 6px;
            font-size: 0.8rem;
            box-sizing: border-box;
            resize: none;
            font-family: inherit;
        }

        .memo-area:focus {
            border-color: #eccc68;
            outline: none;
        }

        /* 対戦相手キャラクター選択グリッドエリア */
        .section-title {
            font-size: 0.8rem;
            color: #eccc68;
            margin-bottom: 4px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .char-grid {
            flex: 2;
            /* 画面中央で最も広いスペースを確保 */
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 4px;
            overflow-y: auto;
            background-color: #1e1e24;
            padding: 6px;
            border-radius: 8px;
            border: 2px solid #3e3e50;
            min-height: 0;
            /* スクロール崩れ防止 */
            margin-bottom: 8px;
        }

        .char-btn {
            background-color: #3e3e50;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 6px 2px;
            font-size: 0.72rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background-color 0.1s, transform 0.05s;
        }

        .char-btn:active {
            transform: scale(0.95);
        }

        .char-btn.selected {
            background-color: #ff4757;
            /* 現在選択（直近で戦った）キャラを強調 */
            box-shadow: 0 0 6px rgba(255, 71, 87, 0.5);
        }

        /* 履歴エリア：コンパクト化して下部に配置 */
        .history-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .history-title {
            font-size: 0.8rem;
            border-bottom: 2px solid #3e3e50;
            padding-bottom: 2px;
            margin-bottom: 4px;
            color: #ff4757;
            flex-shrink: 0;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        .history-item {
            background-color: #1e1e24;
            padding: 4px 8px;
            margin-bottom: 3px;
            border-radius: 4px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #3e3e50;
        }

        .item-win {
            border-left-color: #2ed573;
        }

        .item-lose {
            border-left-color: #ff4757;
        }

        .char-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .time-text {
            font-size: 0.65rem;
            color: #707080;
        }

        /* ポップアップ（カスタムダイアログ）のスタイル */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-box {
            background-color: #2a2a35;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 2px solid #3e3e50;
            width: 80%;
            max-width: 260px;
        }

        .modal-title {
            font-size: 0.95rem;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .modal-btn-group {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #fff;
        }

        .m-win {
            background-color: #2ed573;
        }

        .m-lose {
            background-color: #ff4757;
        }

        .m-cancel {
            background-color: #3e3e50;
            color: #a0a0b0;
            font-size: 0.75rem;
            margin-top: 8px;
            width: 100%;
        }

        .clear-btn {
            background-color: #3e3e50;
            color: #a0a0b0;
            font-size: 0.7rem;
            padding: 4px;
            border-radius: 4px;
            margin-top: 4px;
            width: 100%;
            cursor: pointer;
            border: none;
            flex-shrink: 0;
        }
    </style>
</head>

<body>

    <h1>TEKKEN 8 COUNTER</h1>

    <div class="container">
        <div class="top-row">
            <div class="form-group">
                <label for="my-char-select">使用キャラクター（自分）</label>
                <select id="my-char-select"></select>
            </div>
        </div>

        <div class="counter-display">
            <div class="counter-box">
                <h2>WIN</h2>
                <p id="total-wins" class="win-color">0</p>
            </div>
            <div class="counter-box">
                <h2>LOSE</h2>
                <p id="total-loses" class="lose-color">0</p>
            </div>
            <div class="counter-box">
                <h2>WIN RATE</h2>
                <p id="win-rate" class="rate-color">0%</p>
            </div>
        </div>

        <div class="memo-group">
            <label id="memo-label" for="char-memo">対戦相手 [ 未選択 ] の専用メモ</label>
            <textarea id="char-memo" class="memo-area" placeholder="ここに書いた内容はキャラクターごとに自動保存されます..."
                oninput="saveCharacterMemo()"></textarea>
        </div>

        <div class="section-title">対戦相手を選択して結果を記録</div>
        <div id="char-grid" class="char-grid"></div>

        <div class="history-section">
            <div class="history-title">直近の対戦履歴</div>
            <div id="history-list" class="history-list"></div>
            <button class="clear-btn" onclick="clearHistory()">データをすべてリセット</button>
        </div>
    </div>

    <div id="result-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-target-char" class="modal-title">キャラ名</div>
            <div class="modal-btn-group">
                <button class="modal-btn m-win" onclick="submitMatchResult('WIN')">WIN</button>
                <button class="modal-btn m-lose" onclick="submitMatchResult('LOSE')">LOSE</button>
            </div>
            <button class="modal-btn m-cancel" onclick="closeModal()">キャンセル</button>
        </div>
    </div>

    <script>
        const characterList = [
            "アーマーキング", "アズセナ", "飛鳥", "アリサ", "アンナ", "一八", "ヴィクター", "エディ",
            "キング", "クマ", "クラウディオ", "クライヴ", "州光", "ザフィーナ", "ジャック8", "シャオユウ",
            "シャヒーン", "準", "仁", "スティーブ", "デビル仁", "ドラグノフ", "ニーナ", "範馬 勇次郎",
            "パンダ", "平八", "ファラン", "ファーカムラム", "フェン", "ブライアン", "ボブ", "ポール",
            "ミアリズ", "吉光", "ラース", "リディア", "リリ", "リロイ", "リー", "レイヴン", "麗奈",
            "レオ", "ロジャーJr.", "ロウ"
        ];

        let matchHistory = JSON.parse(localStorage.getItem('t8_counter_v4')) || [];
        let characterMemos = JSON.parse(localStorage.getItem('t8_memos_v4')) || {};
        let currentSelectedOpponent = localStorage.getItem('t8_current_opp_v4') || "一八";
        let pendingOpponentCharacter = ""; // モダルで一時保持用

        // 自分キャラのドロップダウン初期化
        function initMyCharacterDropdown() {
            const mySelect = document.getElementById('my-char-select');
            mySelect.innerHTML = '';
            characterList.forEach(char => {
                const opt = document.createElement('option');
                opt.value = char;
                opt.textContent = char;
                mySelect.appendChild(opt);
            });
            mySelect.value = "仁"; // 初期値
        }

        // 対戦相手ボタン一覧（グリッド）の動的生成
        function initOpponentGrid() {
            const grid = document.getElementById('char-grid');
            grid.innerHTML = '';

            characterList.forEach(char => {
                const btn = document.createElement('button');
                btn.className = 'char-btn';
                btn.id = `btn-${char}`;
                btn.textContent = char;
                // クリックしたら勝敗入力ポップアップを開く
                btn.onclick = () => openResultModal(char);
                grid.appendChild(btn);
            });

            highlightCurrentOpponent();
        }

        // 現在ターゲットにしている（直近で戦った）キャラのボタン色を変える
        function highlightCurrentOpponent() {
            characterList.forEach(char => {
                const btn = document.getElementById(`btn-${char}`);
                if (btn) btn.classList.remove('selected');
            });
            const activeBtn = document.getElementById(`btn-${currentSelectedOpponent}`);
            if (activeBtn) activeBtn.classList.add('selected');
        }

        // キャラクターボタンを押した時にポップアップを表示
        function openResultModal(char) {
            pendingOpponentCharacter = char;
            document.getElementById('modal-target-char').innerHTML = `対戦相手: <strong>${char}</strong><br>試合結果を選択`;
            document.getElementById('result-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
        }

        // ポップアップでWIN/LOSEを押した時の最終処理
        function submitMatchResult(result) {
            const myChar = document.getElementById('my-char-select').value;
            const oppChar = pendingOpponentCharacter;

            const newMatch = {
                myChar: myChar,
                oppChar: oppChar,
                result: result,
                timestamp: new Date().getTime()
            };

            matchHistory.push(newMatch);
            localStorage.setItem('t8_counter_v4', JSON.stringify(matchHistory));

            // 選択したキャラを「現在のターゲット」としてロック
            currentSelectedOpponent = oppChar;
            localStorage.setItem('t8_current_opp_v4', currentSelectedOpponent);

            highlightCurrentOpponent();
            loadCharacterMemo();
            updateDisplay();
            closeModal();
        }

        function formatTimestamp(ms) {
            if (!ms) return "不明";
            const d = new Date(ms);
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function updateDisplay() {
            let wins = 0;
            let loses = 0;

            const listContainer = document.getElementById('history-list');
            listContainer.innerHTML = '';

            // 直近5件のみ描画（コンパクト化のため）
            const maxDisplay = 5;
            let count = 0;

            for (let i = matchHistory.length - 1; i >= 0; i--) {
                const match = matchHistory[i];

                if (match.result === 'WIN') wins++;
                if (match.result === 'LOSE') loses++;

                if (count < maxDisplay) {
                    const timeString = formatTimestamp(match.timestamp);
                    const item = document.createElement('div');
                    const resultClass = match.result === 'WIN' ? 'item-win' : 'item-lose';
                    item.className = `history-item ${resultClass}`;

                    item.innerHTML = `
            <div class="char-info">
              <strong>${match.oppChar}</strong>
              <span class="time-text">(${timeString} / 自分: ${match.myChar})</span>
            </div>
            <span><strong>${match.result}</strong></span>
          `;
                    listContainer.appendChild(item);
                    count++;
                }
            }

            const total = wins + loses;
            const rate = total > 0 ? Math.round((wins / total) * 100) : 0;

            document.getElementById('total-wins').innerText = wins;
            document.getElementById('total-loses').innerText = loses;
            document.getElementById('win-rate').innerText = `${rate}%`;
        }

        function loadCharacterMemo() {
            const memoArea = document.getElementById('char-memo');
            const memoLabel = document.getElementById('memo-label');

            memoLabel.textContent = `対戦相手 [ ${currentSelectedOpponent} ] 専用の対策メモ`;
            memoArea.value = characterMemos[currentSelectedOpponent] || "";
        }

        function saveCharacterMemo() {
            const memoContent = document.getElementById('char-memo').value;
            characterMemos[currentSelectedOpponent] = memoContent;
            localStorage.setItem('t8_memos_v4', JSON.stringify(characterMemos));
        }

        function clearHistory() {
            if (confirm('すべての戦績データおよびキャラクターメモを削除します。よろしいですか？')) {
                matchHistory = [];
                characterMemos = {};
                currentSelectedOpponent = "一八";
                localStorage.removeItem('t8_counter_v4');
                localStorage.removeItem('t8_memos_v4');
                localStorage.removeItem('t8_current_opp_v4');
                updateDisplay();
                highlightCurrentOpponent();
                loadCharacterMemo();
            }
        }

        // 起動時初期化
        initMyCharacterDropdown();
        initOpponentGrid();
        updateDisplay();
        loadCharacterMemo();
    </script>
</body>

</html>
