<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鉄拳8 戦績カウンター</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { background: #1e1e24; color: #f5f5f7; font-family: "Segoe UI", Meiryo, sans-serif; padding: 18px; }
    main { width: 100%; max-width: 560px; margin: 0 auto; }
    h1 { margin: 0 0 16px; color: #ff4757; font-size: 1.25rem; text-align: center; letter-spacing: .08em; }
    .panel { background: #2a2a35; border-radius: 12px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,.3); }
    .counter-display { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: #1e1e24; padding: 12px 8px; border-radius: 8px; text-align: center; }
    .counter-box h2 { color: #a0a0b0; font-size: .7rem; margin: 0; }
    .counter-box p { font-size: 1.7rem; font-weight: 700; margin: 5px 0 0; }
    .total-color { color: #70a1ff; } .win-color { color: #2ed573; } .lose-color { color: #ff4757; } .rate-color { color: #eccc68; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 14px; }
    button { border: 0; border-radius: 7px; color: #fff; cursor: pointer; font-weight: 700; padding: 11px 8px; }
    button:disabled { cursor: wait; opacity: .55; }
    #add-win { background: #2ed573; } #add-lose { background: #ff4757; }
    #undo { background: #4e4e62; } #clear { background: #732f3a; }
    .status { min-height: 2.6em; margin: 12px 0; padding: 9px; border-radius: 6px; background: #1e1e24; color: #a8c7fa; font-size: .8rem; }
    .status-error { color: #ff8d98; }
    .history-title { border-bottom: 2px solid #3e3e50; color: #eccc68; font-size: .85rem; padding-bottom: 5px; }
    .history-list { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
    .history-item { align-items: center; background: #1e1e24; border-left: 4px solid #3e3e50; border-radius: 5px; display: flex; justify-content: space-between; padding: 8px 10px; }
    .item-win { border-left-color: #2ed573; } .item-lose { border-left-color: #ff4757; }
    .time-text, .history-empty { color: #90909f; font-size: .75rem; }
    .history-empty { padding: 12px 4px; text-align: center; }
    @media (max-width: 460px) { .counter-display { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>TEKKEN 8 MATCH RESULTS</h1>
    <section class="panel">
      <div class="counter-display">
        <div class="counter-box"><h2>総試合数</h2><p id="total-matches" class="total-color">0</p></div>
        <div class="counter-box"><h2>WIN</h2><p id="total-wins" class="win-color">0</p></div>
        <div class="counter-box"><h2>LOSE</h2><p id="total-loses" class="lose-color">0</p></div>
        <div class="counter-box"><h2>勝率</h2><p id="win-rate" class="rate-color">0.0%</p></div>
      </div>
      <div class="actions">
        <button id="add-win" data-action>WIN追加</button>
        <button id="add-lose" data-action>LOSE追加</button>
        <button id="undo" data-action>直前の1件を取り消す</button>
        <button id="clear" data-action>全記録を消去する</button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">起動しています…</div>
      <div class="history-title">直近10件の履歴</div>
      <div id="history-list" class="history-list"></div>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
